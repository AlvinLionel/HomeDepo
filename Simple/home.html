<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body class="home_body">
    <header class="home_header">
        <h1>Welcome, <span id="userFirstName">User</span>!</h1>
    </header>

    <main>
        <section id="services">
            <div class="grid">
                <!-- Map Service Card -->
                <div class="card" id="mapCard">
                    <h2>Map</h2>
                    <p>Find shops and services near you.</p>
                    <a href="map.html">Go to Map</a>
                </div>

                <!-- Discovery Catalog Card -->
                <div class="card" id="discoveryCard">
                    <h2>Discovery Catalog</h2>
                    <p>Browse through random products and services.</p>
                    <a href="discovery.html">Discover</a>
                </div>

                <!-- Products Catalog Card -->
                <div class="card" id="productsCard">
                    <h2>Products Catalog</h2>
                    <p>Explore our full product catalog.</p>
                    <a href="products.html">View Products</a>
                </div>

                <!-- Cart Card -->
                <div class="card" id="cartCard">
                    <h2>Cart</h2>
                    <p>View and manage your saved products.</p>
                    <a href="cart.html">Go to Cart</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; HomeX <span id="date"></span>
    </footer>

</body>

</html>
