<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <!-- Login Form -->
    <div id="auth">
        <div id="loginForm">
            <h2>Login</h2>
            <form action="#" method="post">
                <label for="loginEmail">Email</label><br>
                <input type="email" name="loginEmail" id="loginEmail" required><br>
                <label for="loginPassword">Password</label><br>
                <input type="password" name="loginPassword" id="loginPassword" required><br>
                <button type="submit">Login</button>
            </form><br>
            <p>Don't have an account? <a href="#" id="switchToSignup">Sign Up</a></p>
        </div>

        <!-- Sign Up Form -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>
            <form action="#" method="post">
                <label for="signupUsername">Username</label><br>
                <input type="text" name="signupUsername" id="signupUsername" required><br>
                <label for="signupEmail">Email</label><br>
                <input type="email" name="signupEmail" id="signupEmail" required><br>
                <label for="signupPassword">Password</label><br>
                <input type="password" name="signupPassword" id="signupPassword" required><br>
                <label for="confirmPassword">Confirm Password</label><br>
                <input type="password" name="confirmPassword" id="confirmPassword" required><br>
                <button type="submit">Sign Up</button>
            </form><br>
            <p>Already have an account? <a href="#" id="switchToLogin">Login</a></p>
        </div>

    </div>
    <footer>
        &copy; &nbsp; HomeX &nbsp; <span id="date"></span>
    </footer>

</body>

</html>
